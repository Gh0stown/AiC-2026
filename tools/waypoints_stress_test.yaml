# 压力测试用航点: 故意放在"最贴墙"的位置并强制 180 度掉头。
#
#   python3 tools/patrol.py --file tools/waypoints_stress_test.yaml --save-trace /tmp/t.csv
#
# 存在的意义: 复现并回归"贴墙处原地转向卡住/压线"这一类问题。
#
# 两个点都把余量压到极限:
#   tight180 (-1.739, 1.702)  离墙 0.337 m, 余量 0.079 m, 强制掉头到 yaw=0
#   回程      ( 1.772, 1.782) 离墙 0.294 m, 余量 0.036 m, 强制掉头 180 度
#   (底盘外接半径 0.258 m = footprint 外接 0.248 + padding 0.01)
#
# 预期: 两段原地摆正的残余都 < 2 度, 且 0 次恢复行为 —— 因为转向走 cmd_vel,
#       不经过规划器, 不受"旋转余量 < 定位误差"的影响。
# 同时要确认: 车最终**没有压到墙**(真值余量为正)。
start: [1.772, 1.782]
waypoints:
  - {name: tight180, world: [-1.739, 1.702], yaw: 0.0}
