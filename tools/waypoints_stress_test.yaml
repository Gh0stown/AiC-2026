# 压力测试用航点: 故意把点放在"最贴墙"的位置并强制 180 度掉头。
#
#   python3 tools/patrol.py --file tools/waypoints_stress_test.yaml
#
# 存在的意义: 复现并回归"贴墙处原地转向卡住"这一类问题。
# tight180 在 (-1.739, 1.702), 离墙 0.337 m, 而底盘外接半径 0.258 m
# -> 旋转余量只有 0.079 m, 比 AMCL 定位误差(中位 5.1 cm)大不了多少。
# 强制 yaw: 0.0 意味着车到点后要原地掉头 180 度 —— 这是最容易暴露问题的场景。
#
# 预期 (转向全部走 cmd_vel, 不经过规划器):
#   ✓ tight180 到点 ... └ 原地摆正到 0.0 deg, 残余 < 2 deg
#   ✓ return   到点 ... └ 原地摆正到 ±180 deg, 残余 < 2 deg
# 实测 2026-09-18: 两段摆正残余分别 0.7 / 1.0 度, 0 次恢复行为。
start: [1.772, 1.782]
return_to: [1.672, 1.682]
waypoints:
  - {name: tight180, world: [-1.739, 1.702], yaw: 0.0}
