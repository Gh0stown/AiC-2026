# 场地内部**不可通行**区域 (交给 tools/gen_map_from_arena.py --obstacles)
#
# 为什么需要: 白线是车道线, 街区/停车位在车道之外, 赛题要求"不得压越车道线"。
# 但几何地图原先把墙以内全部当自由空间 -> 规划器没有理由不进街区;
# 雷达降到 0.12 m 能看见立牌之后, 街区边上的立牌把车道"挤窄", 规划器就从街区内部绕,
# 结果 AMCL 在街区里看不见足够墙面而自信漂移 2.6 m (2026-10-09 实测)。
# 把街区与停车列标成障碍后, 规划器只能走车道 -> 车道合规与定位同时变稳。
#
# 矩形 [x0, y0, x1, y1], 世界坐标 (m)。来源: config/standees.yaml 的 blocks.rect
# 与 build_arena 提取的停车位列。
- [-1.472, 0.847, -0.452, 1.468]      # A 街区
- [-1.475, -0.537, -0.407, 0.197]     # B 街区
- [1.472, -2.076, 2.176, -0.197]      # 右侧三个停车位 (车所在列)
