# 红绿灯配置（唯一真值源: 工具和切换节点都读它）
#
# ★ 模型原点在**地面**、水平居中, 所以 z 一律给 0（旧模型原点在灯箱中心, z 曾给 0.55）
#
# 位置怎么定的 (2026-09-21, 依据官方复赛资料):
#   1) 尺寸/颜色取自 ~/复赛资料/红绿灯/尺寸图片.png + 红绿灯图片/*.png
#   2) 摆位对照 ~/复赛资料/复赛任务示意图.png: 左上竖排、下方中间横排
#   3) 精确坐标用本场地**已精确已知的斑马线**定位 (build_arena.py 已提取):
#        上斑马线  x [ 0.06,  0.27], y [ 1.50,  2.06]  -> 竖排灯放在它**左侧**
#        中斑马线  x [-0.40,  0.17], y [-0.78, -0.57]  -> 横排灯放在它**下方**
#
# 朝向按示意图里的橙色箭头 (任务要求: "橙黄色箭头表示物料朝向"):
#   上灯 橙箭头朝右 -> 朝 +x   (迎着从起点沿上边往左开的车)
#   下灯 橙箭头朝上 -> 朝 +y   (迎着沿下边往右开的车)
#
# 为什么贴墙放 (|y| = 2.00, 内墙在 2.076):
#   顶部车道中心 y≈1.70、底部 y≈-1.74, 车体半宽 0.24 m -> 车体边缘到 1.94 / -1.98。
#   灯箱在 0.34 m 以上高度(高于车体), 只有 2.5 cm 的细支架在车高范围内, 所以贴墙
#   放不会撞车; 但若把 64 cm 宽的横排灯横着摆在顶部车道上就会挡路。
lights:
  - {name: tl_top, model: traffic_light_v, layout: vertical,   x: -0.15, y:  2.00, z: 0.0, yaw: 0.0}
  - {name: tl_bot, model: traffic_light_h, layout: horizontal, x: -0.12, y: -2.00, z: 0.0, yaw: 1.5708}

# 红/绿/黄切换时序 (比赛要求"须体现红绿黄状态切换"; 红灯期间车身不得越过停止线)
sequence:
  - {color: green,  duration: 6.0}
  - {color: yellow, duration: 2.0}
  - {color: red,    duration: 6.0}
