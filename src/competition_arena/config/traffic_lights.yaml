# 红绿灯配置（唯一真值源: 工具和切换节点都读它）
#
# ★ 官方只有**横排**一种灯具，两盏都用双支架（官方照片就是左右两根脚）
# ★ 模型原点在**地面**、水平居中。z 给 0.002 = 整只灯离地悬放 2mm,
#   配合灯箱关重力 -> 既不落体也不接触地面 -> 完全不会漂/不会晃
#
# 尺寸/颜色来源: ~/复赛资料/红绿灯/尺寸图片.png + 红绿灯图片/*.png
#   灯箱 64 × 14 cm, 下沿离地 34 cm, 支架 2.5 cm, 灯珠 Ø8.5 cm / 间距 22 cm
#
# 摆位 (对照 ~/复赛资料/复赛任务示意图.png: 左上、下方中间各一盏):
#   上斑马线  x [ 0.06,  0.27], y [ 1.50,  2.06]  -> 上灯放它左侧
#   中斑马线  x [-0.40,  0.17], y [-0.78, -0.57]  -> 下灯放它下方
#   朝向按示意图橙色箭头: 上灯 **+x**, 下灯 **+y**
#
# ★ 摆位依据: 官方示意图上的 4 个红点 (tools/detect 出来的像素位置换算到世界系)
#   上灯两个红点: (492,37) 和 (494,212)  -> 世界 (-0.510, 2.079) / (-0.503, 1.478)
#   下灯两个红点: (515,1066) 和 (701,1066) -> 世界 (-0.430, -1.456) / (+0.209, -1.455)
#
#   ★ 关键发现: 上灯的红点**正好踩在顶部车道的两条边线上**(场地边界 y=2.076 和
#     车道内线 y=1.478, 60cm 车道), 下灯的红点在两条竖向车道线的端点上。
#     也就是说**灯是跨在车道上方的"门", 机器人从两条腿中间穿过去** ——
#     这也解释了示意图为什么把上灯画成竖排(俯视看灯箱就是沿 y 铺开的一条)。
#
#   上灯 (-0.506, 1.779) 朝 +x: 跨顶部车道, 腿在 y=1.484/2.074(车道两条边线上),
#        迎着沿上边往左开的车。
#   下灯 (-0.110, -1.280) 朝 +y: 跨那条竖向车道(x≈-0.1), 腿在 x=-0.417/+0.198
#        (正好压在那两条竖车道白线上), 迎着从上往下开过来的车。
#        ★ 2026-09-21 沿车道往里挪了 0.176m (原来 y=-1.456): 原来那个位置正好在
#          竖车道和底部车道的 T 字路口上, 机器人转弯时扫掠区会扫到灯脚、把灯撞倒。
#          往里挪后灯离路口远, 腿仍然压在竖车道白线上、门的作用不变。
#
#   朝向按示意图橙色箭头, 也就是"面对斑马线"(上灯面对右上那条斑马线,
#   下灯面对上方那条中间斑马线)。
#
# 场地外扩 (build_arena.py --margin 0.10) 仍然保留: 上灯灯箱会伸到白线外 2.3cm,
# 围墙退到白线外 0.10m 后就不会和灯箱打架; 也给以后的人偶/车牌等物料留了余量。
lights:

  - {name: tl_top, model: traffic_light_h, layout: horizontal, posts: double,
     x: -0.506, y: 1.779, z: 0.002, yaw: 0.0}
  - {name: tl_bot, model: traffic_light_h, layout: horizontal, posts: double,
     x: -0.110, y: -1.280, z: 0.002, yaw: 1.5708}

# 红/绿/黄切换时序 (比赛要求"须体现红绿黄状态切换"; 红灯期间车身不得越过停止线)
sequence:
  - {color: green,  duration: 6.0}
  - {color: yellow, duration: 2.0}
  - {color: red,    duration: 6.0}
