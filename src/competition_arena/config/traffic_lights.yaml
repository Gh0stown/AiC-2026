# 红绿灯配置（唯一真值源: 工具和切换节点都读它）
#
# ★ 官方只有**横排**一种灯具（2026-09-21 用户确认），两盏都用 traffic_light_h
# ★ 模型原点在**地面**、水平居中, 所以 z 一律给 0（旧模型原点在灯箱中心, z 曾给 0.55）
#
# 尺寸/颜色来源: ~/复赛资料/红绿灯/尺寸图片.png + 红绿灯图片/*.png
#   灯箱 64 × 14 cm, 下沿离地 34 cm, 支架 2.5 cm, 灯珠 Ø8.5 cm / 间距 22 cm
#
# 摆位 (对照 ~/复赛资料/复赛任务示意图.png: 左上、下方中间各一盏):
#   精确坐标用本场地**已精确已知的斑马线**定位 (build_arena.py 已提取):
#     上斑马线  x [ 0.06,  0.27], y [ 1.50,  2.06]  -> 竖排灯放在它**左侧**
#     中斑马线  x [-0.40,  0.17], y [-0.78, -0.57]  -> 横排灯放在它**下方**
#
# ★ 朝向: 两盏都朝**场地内侧**(上灯 -y, 下灯 +y), 即朝着各自那条车道。
#
#   为什么不按示意图的橙色箭头把上灯朝 +x:
#     横排灯宽 64 cm。朝 +x 摆在顶部墙边时, 灯箱沿 y 向铺开 64 cm, 从 y=2.00 算
#     会伸到 y=2.32 —— 而内墙在 2.076、墙高 0.5 m, 灯箱高度 0.34~0.48 m 正好被墙
#     挡住; 绿色透镜在靠墙那一侧, 会被完全遮住。朝内侧摆则进深只有 8 cm, 44 cm
#     宽的灯面平行于墙, 既不挡车道也不被墙遮。
#     (下灯的橙箭头朝 +y, 本来就与"朝内侧"一致。)
#
# 支架: 官方照片是左右两根。两盏灯朝内侧后支架都沿车道方向排开, 不会插进车道,
#       所以都用默认的双支架。
lights:
  - {name: tl_top, model: traffic_light_h, layout: horizontal, posts: double,
     x: -0.15, y:  2.00, z: 0.0, yaw: -1.5708}
  - {name: tl_bot, model: traffic_light_h, layout: horizontal, posts: double,
     x: -0.12, y: -2.00, z: 0.0, yaw:  1.5708}

# 红/绿/黄切换时序 (比赛要求"须体现红绿黄状态切换"; 红灯期间车身不得越过停止线)
sequence:
  - {color: green,  duration: 6.0}
  - {color: yellow, duration: 2.0}
  - {color: red,    duration: 6.0}
