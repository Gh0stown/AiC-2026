# 红绿灯配置（唯一真值源: 工具和切换节点都读它）
#
# ★ 官方只有**横排**一种灯具，两盏都用双支架（官方照片就是左右两根脚）
# ★ 模型原点在**地面**、水平居中。z 给 0.002 = 整只灯离地悬放 2mm,
#   配合灯箱关重力 -> 既不落体也不接触地面 -> 完全不会漂/不会晃
#
# 尺寸/颜色来源: ~/复赛资料/红绿灯/尺寸图片.png + 红绿灯图片/*.png
#   灯箱 64 × 14 cm, 下沿离地 34 cm, 支架 2.5 cm, 灯珠 Ø8.5 cm / 间距 22 cm
#
# 摆位 (对照 ~/复赛资料/复赛任务示意图.png: 左上、下方中间各一盏):
#   上斑马线  x [ 0.06,  0.27], y [ 1.50,  2.06]  -> 上灯放它左侧
#   中斑马线  x [-0.40,  0.17], y [-0.78, -0.57]  -> 下灯放它下方
#   朝向按示意图橙色箭头: 上灯 **+x**, 下灯 **+y**
#
# ★ 为什么需要给场地外扩 (build_arena.py --margin 0.10):
#   横排灯宽 64 cm、脚距 59 cm。白线场地内, 顶部车道边缘(车体 y≈1.94)到白线(2.076)
#   只有 13.6 cm, 底部同理 —— 双支架摆不进去 (底部还差 4mm)。所以把围墙退到白线外
#   0.10 m (= 原图外圈到白线的距离), **白线内仍是 4.2×4.2 可行驶**, 围墙外多出一圈
#   空地放灯。地图也同步重出, 否则 AMCL 会持续看到 10cm 系统性偏差。
#
# 两盏灯的具体位置 (围墙内沿现在在 ±2.176):
#   上灯 y=2.35: 朝 +x, 灯箱沿 y 铺开 64cm -> 两根脚一根在墙内(2.055)、一根在墙外(2.645)。
#                灯箱高 0.34~0.48m **高过 0.30m 围墙**, 所以跨墙不打架;
#                墙内那根脚离车体边缘(1.94+5cm 跟踪误差≈1.99)还有 6cm 余量。
#   下灯 y=-2.078: 朝 +y, 灯箱进深方向才是脚 -> 两根脚沿 x 排开, 整只灯都在墙内,
#                底脚 y∈[-2.158,-2.00], 离车体边缘(-1.98)和围墙(-2.176)各留 1.8cm。
lights:
  - {name: tl_top, model: traffic_light_h, layout: horizontal, posts: double,
     x: -0.15, y:  2.350, z: 0.002, yaw: 0.0}
  - {name: tl_bot, model: traffic_light_h, layout: horizontal, posts: double,
     x: -0.12, y: -2.078, z: 0.002, yaw: 1.5708}

# 红/绿/黄切换时序 (比赛要求"须体现红绿黄状态切换"; 红灯期间车身不得越过停止线)
sequence:
  - {color: green,  duration: 6.0}
  - {color: yellow, duration: 2.0}
  - {color: red,    duration: 6.0}
