# DWA local planner (Dynamic Window Approach)
#
#   sudo apt install ros-noetic-dwa-local-planner
#   roslaunch competition_robot navigation.launch planner:=dwa
#
# 比老的 TrajectoryPlanner 好: 采样 (vx, vth) 的"动态窗口", 打分含
# "贴全局路径 / 朝目标 / 离障碍远", 走直线比 TrajectoryPlanner 稳。
# 这里**按差速车配置**(max_vel_y=0): 麦轮不横移, 车头始终顺着路径,
# 看起来就是"走得直 + 转弯平滑"。想用横移就把 max_vel_y / vy_samples 打开。
DWAPlannerROS:
  max_vel_x: 0.40
  min_vel_x: -0.10
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.40
  min_vel_trans: 0.03
  max_vel_theta: 1.2
  min_vel_theta: 0.20

  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 1.5
  acc_lim_trans: 1.0

  vx_samples: 20
  vy_samples: 1
  vth_samples: 40
  controller_frequency: 10.0

  sim_time: 2.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.05
  # ★ 实测 (干净地图, 3 m 直线): 32/24 时横向偏差 1.6 cm 最好;
  #   改成 50/20 -> 4.7 cm; 80/10 -> 5.4 cm 且变慢。这两个权重别乱动。
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  prune_plan: true
  publish_traj_pc: false
  publish_cost_grid_pc: false
  global_frame_id: odom

  # 停车精度。★ 注意: 这个值**不是**终点偏差的主导因素, 别指望收紧它来提高精度。
  # 实测 (2026-09-18, 贴墙终点 (1.772,1.782), 离墙 0.294m / 底盘外接半径 0.258m
  # => 只有 3.6cm 余量):
  #     0.07 (本值) -> 7/7 航点, 终点余量 +1.5cm, 0 次恢复行为
  #     0.02        -> 6/7 (mid_c 超时 103.8s), 终点余量 -1.4cm 撞墙, 4 次恢复行为
  #                    单点耗时也全面恶化: top_l 17.8s->73.5s, ring 24.9s->80.0s
  # 原因: move_base 在 odom 系里判断是否到点, 而**真值**终点偏差由地图系的 AMCL
  # 定位误差主导(实测 0.033~0.066 m)。收紧容差只是让规划器更拼命去够一个它够不
  # 准的目标 -> 耗时暴增 / 触发恢复行为 -> 反而被推得更偏。
  # 想真正提高终点精度, 要么改定位(AMCL), 要么用里程计做最后一段精定位,
  # 不要动这个值。
  xy_goal_tolerance: 0.07
  yaw_goal_tolerance: 0.30
  latch_xy_goal_tolerance: false   # ★ 别latch: 否则到点前会停下来原地转(你现在遇到的问题)
  trans_stopped_vel: 0.03
  theta_stopped_vel: 0.05
