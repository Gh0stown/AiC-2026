# 航点 (从用户标注的红点自动识别 + 换算; 见 tools/detect_marks.py)
#
# 坐标: world = 场地坐标(m), 与竞技场地/世界系一致 (map 系 = 世界系)
#       pixel = 在 src/competition_arena/docs/coord_world_grid.png 上的像素 (留档对照)
#
# 顺序按用户描述: 出生点 -> 第一个拐角 -> 后面几个点 -> 打圈的点 -> 回出生点
start: [1.772, 1.782]        # 出生位姿 (navigation.launch 里 spawn 用的也是这个) = 终点
# start_yaw: 3.1416           # 回程后要摆正的朝向; 不写就用"出发时记录到的朝向"
#
# 回程目标 = start 本身 (不额外偏移)。
#
# 历史: 曾经因为"回程原地转向有概率卡住"把回程点朝场地中心挪过 10 cm
# (2026-09-18, commit 4545489)。原因见下:
#   出生点在右上角, 离墙只有 2.076-1.782 = 0.294 m, 底盘外接半径(含 padding)
#   0.258 m -> 原地转向余量仅 3.6 cm, 比 AMCL 定位误差(中位 5.1 cm)还小;
#   而当时 go_to() 会把最终朝向下给 move_base, 迫使规划器在墙角原地转,
#   于是定位一抖动就被判成碰撞 -> 偶发卡住。
#
# 但偏移的代价是**终点偏离了原来的位置**, 比赛里"压线"要扣分, 所以又改回来了
# (见下条)。之所以现在敢改回来: 转向已经全部改走 cmd_vel(不经过规划器),
# 贴墙转向不再依赖 costmap 余量。
#
# ★ 现在终点需要的条件只有两条:
#     1) 物理上转得开: 离墙距离 > 底盘实际外接半径 (余量 3.6 cm, 很紧但够) ——
#        因为转向走 cmd_vel, 不再需要给规划器留空间, 所以这个原始位置可以用。
#     2) move_base 能把车**准确**送到位。注意这跟 xy_goal_tolerance 关系不大:
#        真值终点偏差由地图系的 AMCL 定位误差主导 (实测 0.033~0.069 m), 而本点
#        余量只有 0.036 m —— 也就是说**偶尔仍有擦墙/压线的可能**。
#        实测数据与结论见 dwa_local_planner_params.yaml 里 xy_goal_tolerance 的注释。
#        要彻底消除, 得改定位或最后一段用里程计精定位, 不是调容差。
#
# ★ 原来的第一个点(出生小方块拐角 1.709,1.709)已去掉: 它离出生点只有 9 cm,
#   会让车在原地转两次身。现在第一段直接从出生点去 top_l。

waypoints:
  # ① 上面一排: 左 -> (中) -> 打圈留到最后
  - {name: top_l,    pixel: [ 134,  147], world: [-1.739,  1.702]}
  # ② 中间一排: 左 -> 中左 -> 中
  - {name: mid_l,    pixel: [ 138,  502], world: [-1.726,  0.483]}
  - {name: mid_cl,   pixel: [ 385,  504], world: [-0.877,  0.476]}
  - {name: mid_c,    pixel: [ 627,  503], world: [-0.046,  0.479]}
  # ③ 下面一排: 中 -> 右
  - {name: bot_c,    pixel: [ 609, 1149], world: [-0.108, -1.739]}
  - {name: bot_r,    pixel: [ 997, 1158], world: [ 1.224, -1.750]}   # 原标 -1.770 太靠墙, 挪到 -1.750
  # ④ 打圈的点 (最后一站)
  - {name: ring,     pixel: [ 969,  148], world: [ 1.128,  1.698]}
